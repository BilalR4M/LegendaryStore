name: legendarystore

services:
  mysql:
    image: mysql:8.4
    container_name: legendarystore-mysql
    environment:
      MYSQL_ROOT_PASSWORD: shop
      MYSQL_DATABASE: shop_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pshop"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legendarystore-web
    ports:
      - "8080:80"
    volumes:
      - ..:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
